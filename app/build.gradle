plugins {
    id 'com.android.application'
}

def resolveSigningParam = { String key ->
    def prop = findProperty(key)
    if (prop != null && !prop.toString().trim().isEmpty()) {
        return prop.toString().trim()
    }
    def envVal = System.getenv(key)
    if (envVal != null && !envVal.trim().isEmpty()) {
        return envVal.trim()
    }
    return null
}

def stripPassPrefix = { String raw ->
    if (raw == null) return null
    return raw.startsWith("pass:") ? raw.substring(5) : raw
}

def releaseKeystorePath = resolveSigningParam("HYPERALIVE_KEYSTORE")
def releaseKeyAlias = resolveSigningParam("HYPERALIVE_KS_ALIAS")
def releaseStorePass = stripPassPrefix(resolveSigningParam("HYPERALIVE_KS_PASS"))
def releaseKeyPass = stripPassPrefix(resolveSigningParam("HYPERALIVE_KEY_PASS")) ?: releaseStorePass
def hasReleaseSigning = releaseKeystorePath != null &&
        releaseKeyAlias != null &&
        releaseStorePass != null &&
        file(releaseKeystorePath).isFile()

android {
    namespace 'com.hyperalive.aod'
    compileSdk 35

    androidResources {
        noCompress += ['mp4', 'webp']
    }

    defaultConfig {
        applicationId "com.hyperalive.aod"
        minSdk 29
        targetSdk 35
        versionCode 20261124
        versionName "1.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
